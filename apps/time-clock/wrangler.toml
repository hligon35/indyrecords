name = "irm-time-clock"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = false
preview_urls = false

# Populate only in a separately approved environment.
# Protect the entire app + API with a Cloudflare Access application.
[[d1_databases]]
binding = "DB"
database_name = "irm-time-clock"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
ADP_MODE = "simulated"
