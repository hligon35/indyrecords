name = "irm-time-clock-preview"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = true
preview_urls = true

# Replace database_id with the UUID returned when you create irm-employees.
# Protect the entire app + API with a Cloudflare Access application.
[[d1_databases]]
binding = "DB"
database_name = "irm-employees"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
ADP_MODE = "simulated"
APP_ENV = "preview"

# Publish the standalone PWA and Worker at the same origin.
# Restrict the entire hostname with Cloudflare Access before live use.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
