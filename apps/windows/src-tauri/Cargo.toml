[package]
name = "irm-rms-windows"
version = "0.1.0"
description = "Independent IRM RMS desktop prototype"
authors = ["AlphaZoneLabs"]
edition = "2021"

[lib]
name = "irm_rms_windows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde_json = "1"
