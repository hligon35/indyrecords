name: IRM RMS synthetic validation
on:
  push:
    branches: [main, feature/irm-rms-foundation]
  pull_request:
permissions:
  contents: read
jobs:
  api-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:web
      - run: npx wrangler deploy --dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'
  android-bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run test:build-deps
      - run: npm run build:android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npx expo prebuild --platform android --no-install
      - run: ./gradlew :app:compileDebugKotlin :irm-scanner:compileDebugKotlin --no-daemon
        working-directory: apps/mobile/android
  windows-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/windows/package-lock.json
      - run: rustup update stable
      - run: rustup default stable
      - run: npm ci
        working-directory: .
      - run: npm ci
      - run: npm run build
