// Optional Windows build-host workarounds: long CMake object paths and shortened clang++ names.
// Run only from an isolated short checkout; this does not change application behavior or signing.
// Clang derives its driver mode from argv[0]: https://clang.llvm.org/doxygen/ToolChain_8cpp_source.html
if (!System.getProperty('os.name').toLowerCase().contains('windows')) {
    throw new GradleException('This optional linker workaround is for Windows hosts only')
}
allprojects { p ->
    p.afterEvaluate {
        if (p.extensions.findByName('android') != null) {
            p.android.defaultConfig.externalNativeBuild.cmake.arguments '-DCMAKE_SHARED_LINKER_FLAGS=--driver-mode=g++', '-DCMAKE_OBJECT_PATH_MAX=240'
            // A dedicated short staging root also shortens the fixed prefix that CMake cannot hash.
            def stagingRoot = p.findProperty('irmCmakeStagingRoot')
            if (stagingRoot) {
                p.android.externalNativeBuild.cmake.buildStagingDirectory = new File(stagingRoot.toString(), p.path.replace(':', '_'))
            }
        }
    }
}
